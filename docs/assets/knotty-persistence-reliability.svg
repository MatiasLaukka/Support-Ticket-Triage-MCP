<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 960" width="1850" height="960" role="img" aria-labelledby="title desc">
<title id="title">Operational Persistence and Reliability</title><desc id="desc">Transactional commands, causal history, safe retries and separate advisory learning. Atomic local commits are not distributed transactions or cryptographic tamper-evident logs.</desc>
<rect width="1850" height="960" fill="#ffffff"/>
<text x="32" y="65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="750" fill="#142249" text-anchor="start">Operational Persistence and Reliability</text>
<text x="32" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#4b6183" text-anchor="start">Transactional commands, causal history, safe retries and separate advisory learning.</text>
<rect x="1408" y="28" width="410" height="40" rx="20" fill="#f1edff" stroke="#c6b8f6"/>
<text x="1613" y="54" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#423391" text-anchor="middle">Local-first SQLite runtime</text>
<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#20385c"/></marker></defs>
<rect x="24.0" y="146" width="349.2" height="624" rx="16" fill="#eff8ff" stroke="#a3d6fc" stroke-width="1.5"/>
<circle cx="54" cy="184" r="20" fill="#1269cc"/>
<text x="54" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="84" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="730" fill="#17224b" text-anchor="start">Command entry</text>
<text x="42" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">MCP and Approval Desk share mutations.</text>
<rect x="40.0" y="340" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a3d6fc" stroke-width="1.6"/>
<circle cx="64" cy="367" r="12" fill="#dbeeff" stroke="#a3d6fc" />
<text x="64" y="372" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1269cc">1</text>
<text x="86" y="366" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Validated request</text>
<text x="58" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Command ID, actor, allowed fields.</text>
<rect x="40.0" y="463" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a3d6fc" stroke-width="1.6"/>
<circle cx="64" cy="490" r="12" fill="#dbeeff" stroke="#a3d6fc" />
<text x="64" y="495" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1269cc">2</text>
<text x="86" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Current revision</text>
<text x="58" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Optimistic concurrency checks.</text>
<rect x="40.0" y="586" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a3d6fc" stroke-width="1.6"/>
<circle cx="64" cy="613" r="12" fill="#dbeeff" stroke="#a3d6fc" />
<text x="64" y="618" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1269cc">3</text>
<text x="86" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Runtime usage lease</text>
<text x="58" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Prevent unsafe simultaneous resets.</text>
<rect x="24.0" y="790" width="349.2" height="128" rx="13" fill="#eff8ff" stroke="#a3d6fc"/>
<text x="42" y="817" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#1269cc" text-anchor="start">1  Command entry</text>
<text x="42" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">A retry retains the original command</text><text x="42" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">identity.</text>
<path d="M375.2 736 H385.2" stroke="#20385c" stroke-width="3" fill="none" marker-end="url(#arw)"/>
<rect x="387.2" y="146" width="349.2" height="624" rx="16" fill="#f6f3ff" stroke="#c9bdf8" stroke-width="1.5"/>
<circle cx="417.2" cy="184" r="20" fill="#6843cc"/>
<text x="417.2" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="447.2" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="730" fill="#17224b" text-anchor="start">Governed checks</text>
<text x="405.2" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">Determine whether action is legal now.</text>
<rect x="403.2" y="340" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#c9bdf8" stroke-width="1.6"/>
<circle cx="427.2" cy="367" r="12" fill="#ebe5ff" stroke="#c9bdf8" />
<text x="427.2" y="372" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6843cc">1</text>
<text x="449.2" y="366" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Policy and lifecycle</text>
<text x="421.2" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Security, outage, evidence and</text><text x="421.2" y="423" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">closure.</text>
<rect x="403.2" y="463" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#c9bdf8" stroke-width="1.6"/>
<circle cx="427.2" cy="490" r="12" fill="#ebe5ff" stroke="#c9bdf8" />
<text x="427.2" y="495" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6843cc">2</text>
<text x="449.2" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Idempotency</text>
<text x="421.2" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Detect prior result or key conflict.</text>
<rect x="403.2" y="586" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#c9bdf8" stroke-width="1.6"/>
<circle cx="427.2" cy="613" r="12" fill="#ebe5ff" stroke="#c9bdf8" />
<text x="427.2" y="618" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6843cc">3</text>
<text x="449.2" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Atomic transaction</text>
<text x="421.2" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">One consistent commit or none.</text>
<rect x="387.2" y="790" width="349.2" height="128" rx="13" fill="#f6f3ff" stroke="#c9bdf8"/>
<text x="405.2" y="817" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#6843cc" text-anchor="start">2  Governed checks</text>
<text x="405.2" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">No half-applied ticket mutation.</text>
<path d="M738.4 736 H748.4" stroke="#20385c" stroke-width="3" fill="none" marker-end="url(#arw)"/>
<rect x="750.4" y="146" width="349.2" height="624" rx="16" fill="#eefaf4" stroke="#a9dbc8" stroke-width="1.5"/>
<circle cx="780.4" cy="184" r="20" fill="#087c54"/>
<text x="780.4" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="810.4" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="730" fill="#17224b" text-anchor="start">Operational SQLite</text>
<text x="768.4" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">Persist authoritative local ticket</text><text x="768.4" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">state.</text>
<rect x="766.4" y="340" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a9dbc8" stroke-width="1.6"/>
<circle cx="790.4" cy="367" r="12" fill="#dbf5e8" stroke="#a9dbc8" />
<text x="790.4" y="372" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#087c54">1</text>
<text x="812.4" y="366" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Ticket projection</text>
<text x="784.4" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Messages, approvals, diagnoses, fixes.</text>
<rect x="766.4" y="463" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a9dbc8" stroke-width="1.6"/>
<circle cx="790.4" cy="490" r="12" fill="#dbf5e8" stroke="#a9dbc8" />
<text x="790.4" y="495" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#087c54">2</text>
<text x="812.4" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Causal audit trail</text>
<text x="784.4" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Ticket-local ordered events and</text><text x="784.4" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">traces.</text>
<rect x="766.4" y="586" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a9dbc8" stroke-width="1.6"/>
<circle cx="790.4" cy="613" r="12" fill="#dbf5e8" stroke="#a9dbc8" />
<text x="790.4" y="618" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#087c54">3</text>
<text x="812.4" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Command receipts</text>
<text x="784.4" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Replay results after restarts.</text>
<rect x="750.4" y="790" width="349.2" height="128" rx="13" fill="#eefaf4" stroke="#a9dbc8"/>
<text x="768.4" y="817" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#087c54" text-anchor="start">3  Operational SQLite</text>
<text x="768.4" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">Local history is auditable but</text><text x="768.4" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">editable by owner.</text>
<path d="M1101.6 736 H1111.6" stroke="#20385c" stroke-width="3" fill="none" marker-end="url(#arw)"/>
<rect x="1113.6" y="146" width="349.2" height="624" rx="16" fill="#fff9ec" stroke="#f0d89d" stroke-width="1.5"/>
<circle cx="1143.6" cy="184" r="20" fill="#b87812"/>
<text x="1143.6" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1173.6" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="730" fill="#17224b" text-anchor="start">Advisory delivery</text>
<text x="1131.6" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">Keep learning independent of ticket</text><text x="1131.6" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">truth.</text>
<rect x="1129.6" y="340" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#f0d89d" stroke-width="1.6"/>
<circle cx="1153.6" cy="367" r="12" fill="#fff0c9" stroke="#f0d89d" />
<text x="1153.6" y="372" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b87812">1</text>
<text x="1175.6" y="366" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Durable outbox</text>
<text x="1147.6" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Frozen intent within the operational</text><text x="1147.6" y="423" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">commit.</text>
<rect x="1129.6" y="463" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#f0d89d" stroke-width="1.6"/>
<circle cx="1153.6" cy="490" r="12" fill="#fff0c9" stroke="#f0d89d" />
<text x="1153.6" y="495" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b87812">2</text>
<text x="1175.6" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Learning ledger</text>
<text x="1147.6" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Separate SQLite advisory state.</text>
<rect x="1129.6" y="586" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#f0d89d" stroke-width="1.6"/>
<circle cx="1153.6" cy="613" r="12" fill="#fff0c9" stroke="#f0d89d" />
<text x="1153.6" y="618" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b87812">3</text>
<text x="1175.6" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Retry or dead-letter</text>
<text x="1147.6" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Learning errors do not roll back</text><text x="1147.6" y="669" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">support.</text>
<rect x="1113.6" y="790" width="349.2" height="128" rx="13" fill="#fff9ec" stroke="#f0d89d"/>
<text x="1131.6" y="817" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#b87812" text-anchor="start">4  Advisory delivery</text>
<text x="1131.6" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">Outbox delivery can safely lag a</text><text x="1131.6" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">commit.</text>
<path d="M1464.8 736 H1474.8" stroke="#20385c" stroke-width="3" fill="none" marker-end="url(#arw)"/>
<rect x="1476.8" y="146" width="349.2" height="624" rx="16" fill="#f0f7ff" stroke="#a9cffa" stroke-width="1.5"/>
<circle cx="1506.8" cy="184" r="20" fill="#1267ba"/>
<text x="1506.8" y="191" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="1536.8" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="730" fill="#17224b" text-anchor="start">Recovery</text>
<text x="1494.8" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">Restart, reconcile and read back state.</text>
<rect x="1492.8" y="340" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a9cffa" stroke-width="1.6"/>
<circle cx="1516.8" cy="367" r="12" fill="#e1efff" stroke="#a9cffa" />
<text x="1516.8" y="372" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1267ba">1</text>
<text x="1538.8" y="366" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Restart-safe replay</text>
<text x="1510.8" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Return previous semantic result.</text>
<rect x="1492.8" y="463" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a9cffa" stroke-width="1.6"/>
<circle cx="1516.8" cy="490" r="12" fill="#e1efff" stroke="#a9cffa" />
<text x="1516.8" y="495" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1267ba">2</text>
<text x="1538.8" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Read-after-write</text>
<text x="1510.8" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Current ticket and causal event view.</text>
<rect x="1492.8" y="586" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a9cffa" stroke-width="1.6"/>
<circle cx="1516.8" cy="613" r="12" fill="#e1efff" stroke="#a9cffa" />
<text x="1516.8" y="618" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1267ba">3</text>
<text x="1538.8" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Fail closed where needed</text>
<text x="1510.8" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Corrupt operational DB blocks</text><text x="1510.8" y="669" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">mutations.</text>
<rect x="1476.8" y="790" width="349.2" height="128" rx="13" fill="#f0f7ff" stroke="#a9cffa"/>
<text x="1494.8" y="817" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#1267ba" text-anchor="start">5  Recovery</text>
<text x="1494.8" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">Failure mode remains explicit and</text><text x="1494.8" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">testable.</text>
<rect x="24" y="927" width="1800" height="21" fill="none"/>
<text x="32" y="949" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#566b8d" text-anchor="start">Atomic local commits are not distributed transactions or cryptographic tamper-evident logs.</text>
