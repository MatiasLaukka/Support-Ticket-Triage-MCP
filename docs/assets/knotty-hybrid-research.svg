<text x="421.2" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Lexical plus optional semantic</text><text x="421.2" y="423" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">retrieval.</text>
