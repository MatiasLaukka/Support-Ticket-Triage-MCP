<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 960" width="1850" height="960" role="img" aria-labelledby="title desc">
<title id="title">Hybrid Diagnostic Reasoning</title><desc id="desc">Historical evidence is frozen, architectures are compared, and operational authority stays unchanged. E1a preliminary output-validity counts are not diagnostic-quality scores; human adjudication is still outstanding.</desc>
<rect width="1850" height="960" fill="#ffffff"/>
