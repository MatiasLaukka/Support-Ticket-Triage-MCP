<text x="449.2" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">B5 applicability</text>
<text x="421.2" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Does this resource actually apply?</text>
