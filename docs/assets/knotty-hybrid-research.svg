<text x="449.2" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">B4 ranking</text>
<text x="421.2" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Offline policy comparison;</text><text x="421.2" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">inconclusive.</text>
