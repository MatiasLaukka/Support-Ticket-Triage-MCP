<text x="42" y="817" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#1269cc" text-anchor="start">1  Historical evidence</text>
<text x="42" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">Real-world source material, not live</text><text x="42" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">integration.</text>
