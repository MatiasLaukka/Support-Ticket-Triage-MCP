<text x="405.2" y="256" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">Candidate knowledge is prepared</text><text x="405.2" y="279" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#4e617f" text-anchor="start">separately.</text>
