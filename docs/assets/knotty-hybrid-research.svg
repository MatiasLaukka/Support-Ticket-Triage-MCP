<text x="405.2" y="854" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">No retrieval experiment changes ticket</text><text x="405.2" y="878" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#355071" text-anchor="start">policy.</text>
