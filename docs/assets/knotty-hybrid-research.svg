<circle cx="64" cy="490" r="12" fill="#dbeeff" stroke="#a3d6fc" />
<text x="64" y="495" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1269cc">2</text>
<text x="86" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Historical documentation</text>
<text x="58" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">Exact eligible versions or</text><text x="58" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">unavailable.</text>
<rect x="40.0" y="586" width="317.2" height="110" rx="11" fill="#ffffff" stroke="#a3d6fc" stroke-width="1.6"/>
<circle cx="64" cy="613" r="12" fill="#dbeeff" stroke="#a3d6fc" />
<text x="64" y="618" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1269cc">3</text>
<text x="86" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1b2b53" text-anchor="start">Causal evidence boundary</text>
<text x="58" y="651" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">No later issues, comments or</text><text x="58" y="669" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#4f6280" text-anchor="start">hindsight.</text>
